name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_public_repo.py
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m unittest discover -s deploy/tests -v
      - run: node --check static/app.js
      - run: node firmware-next/tests/ota_status_browser_test.js
      - run: node firmware-next/tests/wifi_ui_contract_test.js
      - run: python firmware-next/tests/check_embedded_scripts.py
      - run: docker build -t shift-alarm:check .
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: c++ -std=c++17 firmware/test/scheduler_test.cpp -o /tmp/shift-alarm-test && /tmp/shift-alarm-test
      - run: pio run -d firmware
  firmware-next:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 candidate without device secrets
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C firmware-next build
          idf.py -C firmware-next size
          apt-get update && apt-get install -y --no-install-recommends libssl-dev
          sh firmware-next/components/alarm_ota/tests/run_idf_faithful_tests.sh \
            firmware-next/build/xingzhi-cube-1.54tft-wifi.bin
          python firmware-next/patches/tests/test_patch.py
          sh firmware-next/components/wireguard_lwip/test/run_host_tests.sh
          sh firmware-next/components/microlink/test/run_netif_host_tests.sh
          python firmware-next/components/microlink/test/test_esp_netif_callback.py
  firmware-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: alarm_ota policy and real component fault-injection harness
        run: firmware-next/components/alarm_ota/tests/run_host_tests.sh
      - run: python firmware-next/components/alarm_ota/tests/test_manifest_contract.py
      - run: firmware-next/components/alarm_proxy/test/run_host_tests.sh
      - run: sh firmware-next/components/microlink/test/run_host_tests.sh
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev pkg-config
      - run: firmware-next/components/alarm_tailnet/tests/run_host_tests.sh
      - run: firmware-next/patches/tests/run_host_tests.sh
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/calendar_policy_test.cpp -o /tmp/calendar-test && /tmp/calendar-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/scheduler_test.cpp -o /tmp/scheduler-test && /tmp/scheduler-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware-next/components/arduino_libraries/ArduinoJson/src firmware-next/tests/calendar_metadata_test.cpp -o /tmp/calendar-meta-test && /tmp/calendar-meta-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Wno-deprecated-declarations -Ifirmware-next/components/arduino_libraries/ArduinoJson/src firmware-next/tests/weekly_profiles_test.cpp -o /tmp/weekly-profiles-test && /tmp/weekly-profiles-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/ota_download_policy_test.cpp -o /tmp/ota-download-test && /tmp/ota-download-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/screen_policy_test.cpp -o /tmp/screen-policy-test && /tmp/screen-policy-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/battery_policy_test.cpp -o /tmp/battery-policy-test && /tmp/battery-policy-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/device_ui_test.cpp -o /tmp/device-ui-test && /tmp/device-ui-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/wifi_indicator_test.cpp -o /tmp/wifi-indicator-test && /tmp/wifi-indicator-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/button_policy_test.cpp -o /tmp/button-policy-test && /tmp/button-policy-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/device_identity_test.cpp -o /tmp/device-identity-test && /tmp/device-identity-test
      - run: cc -std=c11 -Wall -Wextra -Werror -Ifirmware-next/components/alarm_tailnet/include firmware-next/components/alarm_tailnet/tests/retry_policy_test.c -o /tmp/tailnet-retry-test && /tmp/tailnet-retry-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/connectivity_policy_test.cpp -o /tmp/connectivity-policy-test && /tmp/connectivity-policy-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined firmware-next/tests/backend_poll_policy_test.cpp -o /tmp/backend-poll-policy-test && /tmp/backend-poll-policy-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/wifi_profiles_test.cpp -o /tmp/wifi-profiles-test && /tmp/wifi-profiles-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware-next/tests/wifi_failover_policy_test.cpp -o /tmp/wifi-failover-test && /tmp/wifi-failover-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware-next/components/arduino_libraries/ArduinoJson/src firmware-next/tests/ota_manifest_policy_test.cpp -o /tmp/ota-manifest-policy-test && /tmp/ota-manifest-policy-test
